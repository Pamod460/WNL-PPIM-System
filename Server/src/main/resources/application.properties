# Secrets are NOT stored in this file. Provide them as environment variables
# (DB_PASSWORD, JWT_SECRET, ...) or in src/main/resources/application-local.properties,
# which is git-ignored. See application-local.properties.example.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wnldb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maxAllowedPacket=67108864


# Must be at least 64 bytes, e.g. output of: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400}

# First-run setup login: only works while the user table is empty.
# Set the SETUP_ADMIN_PASSWORD environment variable to enable it; leave it unset otherwise.
app.setup-admin.username=Admin
app.setup-admin.password=${SETUP_ADMIN_PASSWORD:}

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always
