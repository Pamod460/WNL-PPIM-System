spring.datasource.url=jdbc:mysql://localhost:3306/wnldb
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.hikari.maxAllowedPacket=67108864


jwt.secret=mySecretKey
jwt.expiration=86400

# First-run setup login: only works while the user table is empty.
# Set the SETUP_ADMIN_PASSWORD environment variable to enable it; leave it unset otherwise.
app.setup-admin.username=Admin
app.setup-admin.password=${SETUP_ADMIN_PASSWORD:}

server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
